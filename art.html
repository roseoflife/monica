---
layout: layout
title: My Art
---

<div class="container">
  <h3>My Art</h3>
  <p style="font-family:'Quicksand', sans-serif;">Here are some of my drawings!</p>

  <div class="gallery-grid">
    {% for item in site.data.art %}
    <div class="gallery-item">
      <img src="{{ site.baseurl }}static/img/art/{{ item.file }}" alt="{{ item.caption }}">
      <div class="gallery-caption">{{ item.caption }}</div>
    </div>
    {% endfor %}
  </div>
</div>
